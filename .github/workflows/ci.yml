name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Build package
        run: uv build
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} --with . python -m unittest discover -s src/tri/test -p "test*.py"
